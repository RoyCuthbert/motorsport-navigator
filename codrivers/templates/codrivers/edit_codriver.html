{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h1>
            Edit Co-driver
        </h1>

        <a
            href="{% url 'codriver_detail' codriver.pk %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
