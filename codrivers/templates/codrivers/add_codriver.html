{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1>Add Co-driver</h1>

    <p>
    You currently have {{ codriver_count }} co-driver{{ codriver_count|pluralize }}.
    You can add {{ remaining_slots }} more.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Co-driver
        </button>
    </form>

</div>

{% endblock %}
