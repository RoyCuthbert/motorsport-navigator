{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg">

<div class="card-header bg-danger text-white">

<h2>{{ title }}</h2>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form|crispy }}

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
