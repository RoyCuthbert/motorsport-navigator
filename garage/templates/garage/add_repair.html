{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h2>Add Repair</h2>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <hr>

                        <button type="submit"
                                class="btn btn-danger">

                            <i class="bi bi-check-circle"></i>

                            Save Repair

                        </button>

                        <a href="{% url 'garage:repairs' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
